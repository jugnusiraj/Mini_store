{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <img src="{{ product.image.url }}"
                 class="img-fluid rounded shadow">

        </div>

        <div class="col-md-6">

            <h2>{{ product.name }}</h2>

            <p class="mt-3">

                {{ product.description }}

            </p>

            <h3 class="text-success">

                ₹ {{ product.price }}

            </h3>

            <a href="{% url 'add_to_cart' product.id %}"
               class="btn btn-success mt-3">

                Add To Cart

            </a>

        </div>

    </div>

</div>

{% endblock %}
